<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo task using xhr </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
    <h1 class="m-0 text-center p-2">TODO TASK USING FETCH</h1>
    <div class="container">
        <div class="row">
            <div class="col-md-6 mb-4 ">
                <form id="todoForm">
                    <div class="card">
                    <div class="card-body">
                        <div class="form-group">
                            <label for="formControl"> Enter Todo</label>
                            <input type="text" class="form-control" id="formControl">
                        </div>
                        <button class="btn btn-sm btn-block btn-warning" id="addBtn"> Add Todo</button>
                        <button type="button" class="btn btn-sm btn-block btn-warning d-none" id="updateBtn"> Update Todo</button>
                    </div>
                </div>
                </form>
                
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <ul class="list-group" id="todosContainer">
                            <!-- <li class="list-group-item d-flex justify-content-between"><strong>HTML</strong>
                            <div>
                                <button class="btn btn-outline-warning"> EDIT</button>
                                <button class="btn btn-outline-danger"> REMOVE</button>
                           </div>
                           </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner" id="spinner">        
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
